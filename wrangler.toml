name = "expensify-watcher"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

# Remembers which alerts were already sent. Cloudflare creates it on the first deploy; there is nothing to set up.
[[durable_objects.bindings]]
name = "WATCHER"
class_name = "Watcher"

# The free plan only allows Durable Objects that store their data in SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Watcher"]
